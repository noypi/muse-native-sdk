// pviews Gradle module (NFR-PVIEWS-001 / FR-PVIEWS-001).
// Follows device-lab/app/build.gradle conventions: Android library pinned to
// minSdk 29 so the API 29+ zero-copy gate holds at build time.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.muse.pviews'
    compileSdk 34

    defaultConfig {
        minSdk 29
        targetSdk 34

        externalNativeBuild {
            cmake {
                // NDK r27 pin consumed from the version catalog (NFR-BUILD-016).
                arguments '-DANDROID_PLATFORM=android-29'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../engine/platform-views/CMakeLists.txt'
        }
    }
}

// Verification lanes (TC-PVIEWS-001 / TC-PVIEWS-002 / TC-PVIEWS-007):
//   ./gradlew :pviews:externalMemory  — zero-copy probe (NFR-PVIEWS-001)
//   ./gradlew :pviews:zOrder          — z-order/clipping (FR-PVIEWS-001)
//   ./gradlew :pviews:clipping        — dynamic surface clipping (FR-PVIEWS-005)
//   ./gradlew :pviews:brownfieldEmbed  — brownfield embed (FR-PVIEWS-003)
//   ./gradlew :pviews:composeInterop   — compose interop (FR-PVIEWS-009)
//   ./gradlew :pviews:semanticsMerge   — semantics merge (FR-PVIEWS-009)
//   ./gradlew :pviews:brownfieldHost   — brownfield host (FR-PVIEWS-010)
//   ./gradlew :pviews:sharedEngineTeardown — shared-engine teardown (FR-PVIEWS-010)
//   ./gradlew :pviews:webviewBridge      — webview bridge (TC-PVIEWS-016)
//   ./gradlew :pviews:webviewPersistence — webview persistence (TC-PVIEWS-017)
//   ./gradlew :pviews:webviewHosting     — webview hosting (TC-PVIEWS-018)
//   ./gradlew :pviews:mapsHosting        — maps hosting (TC-PVIEWS-019)
// Each lane compiles its hermetic binary (test + production source,
// -I engine/platform-views/include) and executes it; the build fails on
// any nonzero exit.
tasks.register('externalMemory', Exec) {
    description = 'Run external-memory probe checks (TC-PVIEWS-001).'
    commandLine 'sh', '-c', 'g++ -std=c++17 ../engine/platform-views/tests/external_memory_test.cpp ../engine/platform-views/src/external_memory_probe.cpp -I../engine/platform-views/include -o /tmp/pviews_external_memory && /tmp/pviews_external_memory'
}

tasks.register('zOrder', Exec) {
    description = 'Run z-order checks (TC-PVIEWS-002).'
    commandLine 'sh', '-c', 'g++ -std=c++17 ../engine/platform-views/tests/z_order_test.cpp ../engine/platform-views/src/z_order.cpp -I../engine/platform-views/include -o /tmp/pviews_z_order && /tmp/pviews_z_order'
}

